version: '3.8'

services:
  api:
    build: .
    container_name: green-ai-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - green-ai-network

networks:
  green-ai-network:
    driver: bridge

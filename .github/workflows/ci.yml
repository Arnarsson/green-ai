name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install flake8 black mypy

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 api --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 api --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Check formatting with black
        run: |
          black --check --diff api

      - name: Type check with mypy
        run: |
          mypy api --ignore-missing-imports --no-error-summary || true

      - name: Run tests with pytest
        run: |
          pytest api/tests -v --cov=api --cov-report=xml --cov-report=term-missing
        env:
          ENVIRONMENT: test
          LOG_LEVEL: WARNING

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: green-ai-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container
        run: |
          docker run -d --name test-api -p 8000:8000 green-ai-api:test
          sleep 5

      - name: Test health endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1

      - name: Test API endpoints
        run: |
          # Test providers endpoint
          curl -f http://localhost:8000/v1/providers || exit 1

          # Test regions endpoint
          curl -f http://localhost:8000/v1/regions || exit 1

          # Test estimate endpoint
          curl -f -X POST http://localhost:8000/v1/estimate \
            -H "Content-Type: application/json" \
            -d '{"latency_ms": 2500, "provider": "openai", "region": "us-east-1"}' || exit 1

      - name: Show container logs
        if: always()
        run: docker logs test-api

      - name: Cleanup
        if: always()
        run: docker rm -f test-api

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check for security vulnerabilities with safety
        run: |
          pip install -r api/requirements.txt
          safety check || true

      - name: Run bandit security linter
        run: |
          bandit -r api -ll -ii || true
